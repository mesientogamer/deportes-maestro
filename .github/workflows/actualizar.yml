name: Actualizar parrilla deportiva

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias y ejecutar sistema
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          echo "=== EJECUTANDO DEPORTES MAESTRO ==="
          python src/main.py

      - name: Guardar parrilla actualizada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/parrilla_deportes_automatica.m3u
          if git diff --cached --quiet; then
            echo "No hay cambios en la parrilla."
          else
            git commit -m "Actualizar parrilla deportiva"
            git push
          fi
