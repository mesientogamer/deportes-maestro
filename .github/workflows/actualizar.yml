name: Actualizar parrilla deportiva

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # 1. DESCARGAR REPOSITORIO
      # =====================================================

      - name: Descargar repositorio
        uses: actions/checkout@v4


      # =====================================================
      # 2. CONFIGURAR PYTHON
      # =====================================================

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # =====================================================
      # 3. CONFIGURAR NODE.JS
      # =====================================================

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"


      # =====================================================
      # 4. INSTALAR DEPENDENCIAS PYTHON
      # =====================================================

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # =====================================================
      # 5. DESCARGAR SISTEMA EPG OFICIAL
      # =====================================================

      - name: Descargar sistema EPG oficial
        run: |
          rm -rf .epg

          git clone --depth 1 \
            https://github.com/iptv-org/epg.git \
            .epg


      # =====================================================
      # 6. INSTALAR DEPENDENCIAS EPG
      # =====================================================

      - name: Instalar dependencias EPG
        working-directory: .epg
        run: |
          npm install


      # =====================================================
      # 7. BUSCAR FUENTES EPG DEPORTIVAS
      # ESPAÑOL FUERA
      # =====================================================

      - name: Buscar canales deportivos con EPG
        run: |
          python - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          from pathlib import Path
          import requests
          import re
          from difflib import SequenceMatcher

          API_URL = "https://iptv-org.github.io/api/channels.json"

          print("=" * 70)
          print("BUSCANDO FUENTES EPG DEPORTIVAS")
          print("ESPAÑOL EXCLUIDO")
          print("=" * 70)

          # =================================================
          # NORMALIZAR NOMBRES
          # =================================================

          def normalize(text):
              text = str(text or "").lower()

              replacements = {
                  "á": "a",
                  "é": "e",
                  "í": "i",
                  "ó": "o",
                  "ú": "u",
                  "ü": "u",
                  "ñ": "n",
              }

              for old, new in replacements.items():
                  text = text.replace(old, new)

              text = re.sub(r"[^a-z0-9]+", " ", text)
              text = re.sub(r"\s+", " ", text).strip()

              return text

          # =================================================
          # IDIOMAS ESPAÑOLES A EXCLUIR
          # =================================================

          SPANISH_LANGS = {
              "es",
              "es-ES",
              "es-MX",
              "es-AR",
              "es-CO",
              "es-CL",
              "es-PE",
              "es-UY",
              "es-EC",
              "es-PY",
              "es-BO",
              "es-VE",
              "es-CR",
              "es-PA",
              "es-DO",
              "es-GT",
              "es-HN",
              "es-SV",
              "es-NI",
              "es-CU",
          }

          def is_spanish(lang):
              lang = str(lang or "").strip()
              return lang.lower() in {
                  x.lower()
                  for x in SPANISH_LANGS
              }

          # =================================================
          # PALABRAS DEPORTIVAS
          # =================================================

          SPORT_CHANNEL_WORDS = [
              "sport",
              "sports",
              "bein",
              "espn",
              "eurosport",
              "tennis",
              "tenis",
              "nba",
              "wnba",
              "fiba",
              "basket",
              "basketball",
              "baloncesto",
              "football",
              "soccer",
              "futbol",
              "formula",
              "formula 1",
              "formula1",
              "f1",
              "motogp",
              "moto gp",
              "moto2",
              "moto3",
              "racing",
              "rally",
              "golf",
              "cricket",
              "rugby",
              "hockey",
              "nfl",
              "nhl",
              "mlb",
              "nascar",
              "ufc",
              "boxing",
              "boxeo",
              "wrestling",
              "olympic",
              "olympics",
              "arena",
              "stadium",
              "fox sports",
              "sky sport",
              "sportklub",
              "super sport",
          ]

          # =================================================
          # DESCARGAR CANALES IPTV-ORG
          # =================================================

          print("")
          print("Descargando canales de IPTV-ORG...")

          response = requests.get(
              API_URL,
              timeout=120,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          response.raise_for_status()

          channels = response.json()

          # =================================================
          # INDEXAR CANALES DEPORTIVOS
          # =================================================

          sports_channels = {}
          sports_names = {}

          for channel in channels:

              if not isinstance(channel, dict):
                  continue

              channel_id = str(
                  channel.get("id", "")
              ).strip()

              if not channel_id:
                  continue

              categories = {
                  str(x).strip().lower()
                  for x in channel.get(
                      "categories",
                      []
                  )
              }

              name = str(
                  channel.get("name", "")
              ).strip()

              if "sports" in categories:

                  sports_channels[channel_id] = channel

                  normalized_name = normalize(name)

                  if normalized_name:
                      sports_names.setdefault(
                          normalized_name,
                          set()
                      ).add(channel_id)

          print(
              f"Canales deportivos detectados: "
              f"{len(sports_channels)}"
          )

          # =================================================
          # BUSCAR ARCHIVOS EPG
          # =================================================

          files = glob.glob(
              ".epg/sites/**/*.channels.xml",
              recursive=True
          )

          print(
              f"Archivos EPG examinados: "
              f"{len(files)}"
          )

          matches = {}

          exact_matches = 0
          name_matches = 0
          fuzzy_matches = 0
          sport_sources = 0
          spanish_removed = 0

          # =================================================
          # PROCESAR ARCHIVOS
          # =================================================

          for filename in files:

              try:
                  root = ET.parse(
                      filename
                  ).getroot()

              except Exception:
                  continue

              for channel in root.findall(
                  ".//channel"
              ):

                  xmltv_id = str(
                      channel.get(
                          "xmltv_id",
                          ""
                      )
                  ).strip()

                  site = str(
                      channel.get(
                          "site",
                          ""
                      )
                  ).strip()

                  site_id = str(
                      channel.get(
                          "site_id",
                          ""
                      )
                  ).strip()

                  lang = str(
                      channel.get(
                          "lang",
                          ""
                      )
                  ).strip()

                  name = str(
                      channel.text or ""
                  ).strip()

                  if not site or not site_id:
                      continue

                  # =================================================
                  # ELIMINAR ESPAÑOL
                  # =================================================

                  if is_spanish(lang):
                      spanish_removed += 1
                      continue

                  normalized_name = normalize(name)

                  # =================================================
                  # 1. XMLTV_ID DIRECTO
                  # =================================================

                  if (
                      xmltv_id
                      and
                      xmltv_id in sports_channels
                  ):

                      key = (
                          site,
                          site_id,
                          lang,
                          xmltv_id
                      )

                      matches[key] = {
                          "site": site,
                          "site_id": site_id,
                          "lang": lang,
                          "xmltv_id": xmltv_id,
                          "name": name
                      }

                      exact_matches += 1

                      continue

                  # =================================================
                  # 2. DETECTAR DEPORTE POR NOMBRE
                  # =================================================

                  is_sport_channel = False

                  for word in SPORT_CHANNEL_WORDS:

                      if normalize(word) in normalized_name:

                          is_sport_channel = True
                          break

                  if not is_sport_channel:
                      continue

                  sport_sources += 1

                  # =================================================
                  # 3. NOMBRE EXACTO
                  # =================================================

                  possible_ids = sports_names.get(
                      normalized_name,
                      set()
                  )

                  if len(possible_ids) == 1:

                      matched_id = next(
                          iter(possible_ids)
                      )

                      key = (
                          site,
                          site_id,
                          lang,
                          matched_id
                      )

                      matches[key] = {
                          "site": site,
                          "site_id": site_id,
                          "lang": lang,
                          "xmltv_id": matched_id,
                          "name": name
                      }

                      name_matches += 1

                      continue

                  # =================================================
                  # 4. COINCIDENCIA APROXIMADA
                  # =================================================

                  best_id = None
                  best_score = 0.0

                  for api_name, ids in sports_names.items():

                      if not api_name:
                          continue

                      score = SequenceMatcher(
                          None,
                          normalized_name,
                          api_name
                      ).ratio()

                      if score > best_score:

                          best_score = score

                          if len(ids) == 1:
                              best_id = next(
                                  iter(ids)
                              )

                  if (
                      best_id
                      and
                      best_score >= 0.90
                  ):

                      key = (
                          site,
                          site_id,
                          lang,
                          best_id
                      )

                      matches[key] = {
                          "site": site,
                          "site_id": site_id,
                          "lang": lang,
                          "xmltv_id": best_id,
                          "name": name
                      }

                      fuzzy_matches += 1

          # =================================================
          # CREAR CUSTOM.CHANNELS.XML
          # =================================================

          output = Path(
              ".epg/custom.channels.xml"
          )

          output.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          root = ET.Element(
              "channels"
          )

          for item in sorted(
              matches.values(),
              key=lambda x: (
                  x["xmltv_id"],
                  x["site"],
                  x["site_id"],
                  x["lang"]
              )
          ):

              element = ET.SubElement(
                  root,
                  "channel"
              )

              element.set(
                  "site",
                  item["site"]
              )

              element.set(
                  "site_id",
                  item["site_id"]
              )

              element.set(
                  "lang",
                  item["lang"]
              )

              element.set(
                  "xmltv_id",
                  item["xmltv_id"]
              )

              element.text = item["name"]

          tree = ET.ElementTree(
              root
          )

          tree.write(
              output,
              encoding="utf-8",
              xml_declaration=True
          )

          # =================================================
          # RESULTADO
          # =================================================

          print("")
          print("=" * 70)
          print("RESULTADO")
          print("=" * 70)

          print(
              f"Canales deportivos IPTV-ORG: "
              f"{len(sports_channels)}"
          )

          print(
              f"Coincidencias directas: "
              f"{exact_matches}"
          )

          print(
              f"Coincidencias por nombre: "
              f"{name_matches}"
          )

          print(
              f"Coincidencias aproximadas: "
              f"{fuzzy_matches}"
          )

          print(
              f"Fuentes deportivas detectadas: "
              f"{sport_sources}"
          )

          print(
              f"Fuentes españolas eliminadas: "
              f"{spanish_removed}"
          )

          print(
              f"TOTAL CONFIGURACIONES EPG: "
              f"{len(matches)}"
          )

          print(
              f"Archivo creado: "
              f"{output}"
          )

          print("=" * 70)

          if not matches:
              print("")
              print(
                  "ERROR: no se encontró ninguna "
                  "fuente EPG deportiva no española."
              )
              raise SystemExit(1)

          PY


      # =====================================================
      # 8. GENERAR EPG
      # =====================================================

      - name: Generar EPG
        working-directory: .epg
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: |
          echo "============================================================"
          echo "GENERANDO EPG"
          echo "============================================================"

          npm run grab -- \
            --channels=custom.channels.xml \
            --output=../output/guide.xml \
            --days=1 \
            --timeout=30000 \
            --delay=100 \
            --maxConnections=3

          echo ""
          echo "============================================================"
          echo "EPG GENERADO"
          echo "============================================================"

          ls -lh ../output/guide.xml


      # =====================================================
      # 9. EJECUTAR DEPORTES MAESTRO
      # =====================================================

      - name: Ejecutar Deportes Maestro
        run: |
          echo "============================================================"
          echo "=== EJECUTANDO DEPORTES MAESTRO ==="
          echo "============================================================"

          python -u src/main.py

          echo ""
          echo "============================================================"
          echo "=== FIN PYTHON ==="
          echo "============================================================"


      # =====================================================
      # 10. GUARDAR PARRILLA
      # =====================================================

      - name: Guardar parrilla actualizada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "============================================================"
          echo "SINCRONIZANDO CON GITHUB"
          echo "============================================================"

          git fetch origin main

          # Nos colocamos sobre la versión más reciente de GitHub
          # conservando la M3U que acabamos de generar.
          git reset --soft origin/main

          git add output/parrilla_deportes_automatica.m3u

          if git diff --cached --quiet; then
            echo "No hay cambios en la parrilla."
          else
            git commit -m "Actualizar parrilla deportiva sin español"
            git push origin HEAD:main
          fi
